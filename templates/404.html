{% extends 'base.html' %}
{% block title %}페이지를 찾을 수 없습니다{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div style="text-align:center;padding:2rem 1.5rem;">
    <div style="font-size:5rem;font-weight:900;color:var(--primary);opacity:0.55;letter-spacing:-4px;line-height:1;">404</div>
    <h2 style="color:var(--text);margin:1rem 0 0.5rem;font-size:1.4rem;font-weight:700;letter-spacing:-0.5px;">페이지를 찾을 수 없습니다</h2>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:2rem;">요청하신 페이지가 존재하지 않습니다.</p>
    <a href="{{ url_for('index') }}" class="btn-back">← 홈으로 돌아가기</a>
  </div>
</div>
{% endblock %}
