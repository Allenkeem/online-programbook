<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}서강연극회 관리자{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: #0f0f1a; color: #e8e2d9; }
    .navbar { background: #0a0a0f !important; border-bottom: 1px solid #2a2a2a; }
    .navbar-brand { color: #c9a84c !important; font-weight: 700; }
    .card { background: #1a1a2e; border: 1px solid #2a2a2a; color: #e8e2d9; }
    .btn-gold { background: #c9a84c; color: #000; font-weight: 600; border: none; }
    .btn-gold:hover { background: #b89035; color: #000; }
    .btn-outline-gold { border: 1px solid #c9a84c; color: #c9a84c; background: transparent; }
    .btn-outline-gold:hover { background: #c9a84c; color: #000; }
    .section-title { font-weight: 700; color: #e8e2d9; }
    .form-label { color: #9a9488; font-size: 0.85rem; }
    footer { background: #0a0a0f; border-top: 1px solid #2a2a2a; padding: 1.5rem; margin-top: 3rem; text-align: center; }
    .footer-brand { color: #c9a84c; font-weight: 600; }
    .nav-tabs { border-color: #2a2a2a; }
    .nav-tabs .nav-link { color: #9a9488; border-color: transparent; }
    .nav-tabs .nav-link.active { background: #1a1a2e; border-color: #2a2a2a #2a2a2a #1a1a2e; color: #c9a84c; }
    .tab-content { border: 1px solid #2a2a2a; border-top: none; padding: 1.5rem; background: #1a1a2e; border-radius: 0 0 8px 8px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">서강연극회</a>
      <div class="ms-auto d-flex gap-3 align-items-center">
        <a href="{{ url_for('admin_dashboard') }}" class="nav-link text-light small">대시보드</a>
        <a href="{{ url_for('admin_logout') }}" class="nav-link text-secondary small">로그아웃</a>
      </div>
    </div>
  </nav>

  <div style="padding-top: 70px; min-height: calc(100vh - 120px);">
    {% with messages = get_flashed_messages() %}{% if messages %}
    <div class="container mt-3">
      {% for msg in messages %}
      <div class="alert alert-warning alert-dismissible fade show">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </div>

  <footer>
    <p class="footer-brand mb-1">서강연극회</p>
    <p class="small mb-0" style="color:#666;">서강대학교 연극 동아리</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
